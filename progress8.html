<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Progress Bars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="progress8.css">
</head>

<body>
    <span class="text-dark fw-medium d-block mb-2" style="font-size: 14px;">File Upload</span>
    <div class="crm-progress-track thick-track">
        <div class="crm-progress-fill bg-primary d-flex align-items-center justify-content-end px-2 text-white fw-bold"
            style="font-size: 11px;" id="progressBar8" data-target="55">
            <span class="inner-text">0%</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="progress8.js"></script>
</body>

</html>
