<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Deal Offcanvas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="offcanvas4.css">
</head>
<body>

<div class="container py-5 d-flex justify-content-center">
    <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#addDealOffcanvas">
        Mở Add Deal Offcanvas
    </button>
</div>

<div class="offcanvas offcanvas-end custom-offcanvas" tabindex="-1" id="addDealOffcanvas">
    
    <div class="offcanvas-header border-bottom px-4 py-3 bg-white">
        <h4 class="offcanvas-title fw-bold text-dark">Add deal</h4>
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-sm custom-btn-outline d-flex align-items-center gap-2">
                <i class="bi bi-gear text-secondary"></i> Customize fields
            </button>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
    </div>

    <div class="offcanvas-body px-4 py-3 custom-scrollbar">
        
        <div class="mb-4">
            <label class="form-label form-field-label">Related contact</label>
            <div class="position-relative">
                <select class="form-select custom-select-appearance">
                    <option></option>
                </select>
                <i class="bi bi-caret-down-fill select-caret text-secondary"></i>
            </div>
            <div class="mt-2">
                <div class="record-chip d-inline-flex align-items-center gap-2" id="contactChip">
                    <img src="https://i.pravatar.cc/150?img=44" alt="Laura" class="rounded-circle" width="20" height="20">
                    <span>Laura Norda (sample)</span>
                    <i class="bi bi-x text-secondary ms-1 chip-close" id="removeContactChip"></i>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label form-field-label">Related account</label>
            <div class="custom-select-box d-flex justify-content-between align-items-center">
                <span class="text-dark" id="accountText">Acme Inc (sample)</span>
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-x text-secondary action-clear" id="clearAccount"></i>
                    <i class="bi bi-caret-down-fill text-secondary" style="font-size: 10px;"></i>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label form-field-label">Deal type</label>
            <div class="position-relative">
                <select class="form-select custom-select-appearance text-muted">
                    <option selected>Click to select</option>
                </select>
                <i class="bi bi-caret-down-fill select-caret text-secondary"></i>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label form-field-label">Deal name <span class="text-danger">*</span></label>
            <input type="text" class="form-control custom-input input-focus-blue" value="Acme Inc (sample) Deal">
        </div>

        <div class="row gx-3 mb-4">
            <div class="col-4">
                <label class="form-label form-field-label">Currency</label>
                <div class="position-relative">
                    <select class="form-select custom-select-appearance bg-light text-muted" disabled>
                        <option selected>USD</option>
                    </select>
                    <i class="bi bi-caret-down-fill select-caret text-secondary"></i>
                </div>
            </div>
            <div class="col-8">
                <label class="form-label form-field-label">Deal value <span class="text-danger">*</span></label>
                <input type="text" class="form-control custom-input input-focus-blue" value="0">
            </div>
        </div>

        <div class="mb-4">
            <button class="btn w-100 add-products-btn d-flex align-items-center gap-2">
                <i class="bi bi-box-seam"></i> Add products
            </button>
        </div>

        <div class="mb-4">
            <label class="form-label form-field-label">Deal stage</label>
            <div class="position-relative">
                <select class="form-select custom-select-appearance text-muted">
                    <option selected>Click to select</option>
                </select>
                <i class="bi bi-caret-down-fill select-caret text-secondary"></i>
            </div>
        </div>

    </div>

    <div class="offcanvas-footer border-top px-4 py-3 bg-white d-flex justify-content-end align-items-center">
        <div class="d-flex gap-2">
            <button class="btn btn-cancel px-4" data-bs-dismiss="offcanvas">Cancel</button>
            <button class="btn btn-save px-4">Save</button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="offcanvas4.js"></script>
</body>
</html>
