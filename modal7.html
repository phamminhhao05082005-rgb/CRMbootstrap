<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Add Menu</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="modal7.css">
</head>
<body>

<div class="container py-5 d-flex justify-content-center bg-light min-vh-100">
    
    <div class="dropdown">
        <button class="btn btn-global-add" type="button" data-bs-toggle="dropdown" aria-expanded="false" data-bs-offset="0,8">
            <i class="bi bi-plus-lg"></i>
        </button>
        
        <div class="dropdown-menu custom-mega-menu shadow-lg">
            
            <div class="menu-category-header">RECORDS</div>
            <div class="menu-grid">
                <a href="#" class="menu-item">
                    <div class="icon-wrapper"><i class="bi bi-person"></i></div>
                    <span class="item-text">Add contact</span>
                </a>
                <a href="#" class="menu-item">
                    <div class="icon-wrapper"><i class="bi bi-building"></i></div>
                    <span class="item-text">Add account</span>
                </a>
                <a href="#" class="menu-item">
                    <div class="icon-wrapper icon-circle"><i class="bi bi-currency-dollar"></i></div>
                    <span class="item-text">Add deal</span>
                </a>
                <a href="#" class="menu-item">
                    <div class="icon-wrapper"><i class="bi bi-box-seam"></i></div>
                    <span class="item-text">Add product</span>
                </a>
                <a href="#" class="menu-item">
                    <div class="icon-wrapper"><i class="bi bi-file-earmark-text"></i></div>
                    <span class="item-text">Add Quote</span>
                </a>
            </div>

            <div class="menu-category-header">SALES ACTIVITIES</div>
            <div class="menu-grid">
                <a href="#" class="menu-item">
                    <div class="icon-wrapper"><i class="bi bi-calendar-check"></i></div>
                    <span class="item-text">Add task</span>
                </a>
                <a href="#" class="menu-item">
                    <div class="icon-wrapper"><i class="bi bi-calendar-event"></i></div>
                    <span class="item-text">Add meeting</span>
                </a>
                <a href="#" class="menu-item">
                    <div class="icon-wrapper"><i class="bi bi-telephone"></i></div>
                    <span class="item-text">Add call log</span>
                </a>
                <a href="#" class="menu-item">
                    <div class="icon-wrapper"><i class="bi bi-chat-left-text"></i></div>
                    <span class="item-text">Send SMS</span>
                </a>
            </div>

            <div class="menu-category-header">EMAILS</div>
            <div class="menu-grid pb-2">
                <a href="#" class="menu-item">
                    <div class="icon-wrapper"><i class="bi bi-envelope"></i></div>
                    <span class="item-text">Send email</span>
                </a>
                <a href="#" class="menu-item">
                    <div class="icon-wrapper"><i class="bi bi-envelope-paper"></i></div>
                    <span class="item-text">Create template</span>
                </a>
                <a href="#" class="menu-item">
                    <div class="icon-wrapper"><i class="bi bi-bullseye"></i></div>
                    <span class="item-text">Create sales sequence</span>
                </a>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
