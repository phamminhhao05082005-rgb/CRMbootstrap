<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Card</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="card5.css">
</head>
<body>

<div class="container py-5 d-flex justify-content-center">
    
    <div class="custom-deal-card p-3">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <h6 class="deal-title m-0">Widgetz.io (sample)</h6>
            <button class="btn btn-expand p-0 d-flex align-items-center justify-content-center">
                <i class="bi bi-arrows-angle-expand"></i>
            </button>
        </div>
        
        <div class="d-flex align-items-center gap-2 mb-2">
            <span class="deal-amount fw-bold">$5,600</span>
            <span class="dot-separator">•</span>
            <span class="deal-date">Closes in Nov</span>
        </div>
        
        <div class="d-flex align-items-center gap-2 mb-3">
            <a href="#" class="company-link text-decoration-none">Widgetz.io (sample)</a>
            <span class="dot-separator">•</span>
            <span class="badge custom-badge">CRM - Gold pl...</span>
        </div>
        
        <div class="d-flex justify-content-between align-items-center">
            <div class="deal-notes d-flex align-items-center gap-1">
                <i class="bi bi-file-earmark-text"></i> 1 note
            </div>
            <div class="action-icons d-flex align-items-center gap-2">
                <i class="bi bi-envelope"></i>
                <i class="bi bi-telephone"></i>
                <i class="bi bi-file-earmark-text"></i>
                <i class="bi bi-chat-left-text"></i>
                <i class="bi bi-exclamation-circle alert-icon"></i>
                <i class="bi bi-three-dots-vertical"></i>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
