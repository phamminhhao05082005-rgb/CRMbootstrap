<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Card</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="card6.css">
</head>
<body>

<div class="container py-5 d-flex justify-content-center">
    
    <div class="activity-card w-100" style="max-width: 800px;">
        
        <div class="d-flex align-items-start gap-3 mb-4">
            <div class="act-icon icon-green flex-shrink-0">
                <i class="bi bi-currency-dollar"></i>
            </div>
            <div class="d-flex flex-column justify-content-center h-100 mt-1 w-100">
                <div class="text-muted-custom mb-1">Laura's open deals</div>
                <div class="d-flex align-items-center flex-wrap gap-4">
                    <a href="#" class="act-link">Acme Inc (sample)</a>
                    <span class="text-dark fw-medium">$100</span>
                    <span class="status-badge">Qualification</span>
                    <span class="text-dark">Closes in 3 days</span>
                </div>
            </div>
        </div>

        <div class="d-flex align-items-start gap-3 mb-4">
            <div class="act-icon icon-purple flex-shrink-0">
                <i class="bi bi-calendar3"></i>
            </div>
            <div class="d-flex flex-column justify-content-center h-100 mt-1">
                <div class="text-muted-custom mb-1">No upcoming meetings with Laura.</div>
                <div>
                    <a href="#" class="act-link d-inline-flex align-items-center gap-1">
                        <i class="bi bi-plus-circle"></i> Add meeting
                    </a>
                </div>
            </div>
        </div>

        <div class="d-flex align-items-start gap-3 mb-4">
            <div class="act-icon icon-orange flex-shrink-0">
                <i class="bi bi-envelope"></i>
            </div>
            <div class="d-flex justify-content-between align-items-center w-100 mt-1">
                <div class="d-flex flex-column">
                    <div class="text-muted-custom">Laura Norda (sample) sent an email</div>
                    <div class="text-dark fw-medium mt-1 mb-1">Add-on license for CRM Gold <i class="bi bi-chevron-right" style="font-size: 10px;"></i></div>
                    <div class="text-muted-custom" style="font-size: 13px;">13 days ago</div>
                </div>
                <div>
                    <button class="btn btn-reply d-inline-flex align-items-center gap-1">
                        <i class="bi bi-reply"></i> Reply
                    </button>
                </div>
            </div>
        </div>

        <div class="d-flex align-items-start gap-3">
            <div class="act-icon icon-cyan flex-shrink-0">
                <i class="bi bi-bullseye"></i>
            </div>
            <div class="d-flex flex-column justify-content-center h-100 mt-1">
                <div class="text-muted-custom mb-1">Laura is not part of any sales sequence.</div>
                <div>
                    <a href="#" class="act-link d-inline-flex align-items-center gap-1">
                        <i class="bi bi-plus-circle"></i> Add to a sequence
                    </a>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
