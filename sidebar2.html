<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox Sidebar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="sidebar2.css">
</head>
<body>

<div class="d-flex vh-100 overflow-hidden">
    
    <div class="inbox-sidebar bg-white border-end">
        
        <div class="p-3 border-bottom">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <a href="#" class="text-dark text-decoration-none d-flex align-items-center gap-2 fw-bold fs-5">
                    <i class="bi bi-chevron-double-left fs-6"></i> Inbox
                </a>
                <i class="bi bi-search text-secondary cursor-pointer fs-5"></i>
            </div>
            <div class="text-muted d-flex align-items-center gap-1" style="font-size: 13px;">
                Outside of working hours <i class="bi bi-info-circle cursor-pointer"></i>
            </div>
        </div>

        <div class="py-2 sidebar-scroll">
            <ul class="nav flex-column custom-v-nav">
                
                <li class="nav-item">
                    <a class="nav-link active" href="#">
                        <span>Unassigned</span>
                        <span class="nav-count">1</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <span>Assigned to me</span>
                        <span class="nav-count">0</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <span>All open</span>
                        <span class="nav-count">1</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <span>Chat</span>
                        <span class="nav-count">1</span>
                    </a>
                </li>

                <li class="nav-item mt-1">
                    <a class="nav-link toggle-more text-muted" data-bs-toggle="collapse" href="#moreViews" role="button" aria-expanded="true">
                        <i class="bi bi-chevron-up toggle-icon"></i> <span class="ms-1 toggle-text">Less</span>
                    </a>
                </li>

                <div class="collapse show" id="moreViews">
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <span>Email</span>
                            <span class="nav-count">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <span>Calls</span>
                            <span class="nav-count">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <span>All closed</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <span>Sent</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <span>Spam</span>
                            <span class="nav-count">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <span>Trash</span>
                        </a>
                    </li>
                </div>

            </ul>
        </div>
    </div>

    <main class="flex-grow-1 bg-light p-4 overflow-auto">
        
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="sidebar2.js"></script>
</body>
</html>
