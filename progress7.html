<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Progress Bars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="progress7.css">
</head>

<body>
    <span class="text-dark fw-medium d-block mb-2" style="font-size: 14px;">Monthly Goal Tracker</span>
    <div class="crm-progress-track milestone-track position-relative">
        <div class="crm-progress-fill bg-success" id="progressBar7" data-target="65"></div>
        <div class="milestone-marker" style="left: 80%;">
            <div class="marker-line"></div>
            <span class="marker-text">Target</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="progress7.js"></script>
</body>

</html>
