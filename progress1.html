<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Progress Bars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="progress1.css">
</head>

<body>
    <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-dark fw-medium" style="font-size: 14px;">Importing contacts...</span>
        <span class="text-secondary" style="font-size: 13px;" id="progressText1">0%</span>
    </div>
    <div class="crm-progress-track">
        <div class="crm-progress-fill bg-primary" id="progressBar1" data-target="75"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="progress1.js"></script>
</body>

</html>
